services:
  - type: web
    name: telegram-manager-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: telegram-session
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: APP_API_KEY
        generateValue: true
      - key: SESSION_PATH
        value: /var/data/telegram_manager
